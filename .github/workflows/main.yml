name: Build Counter Fatih APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o Counter_Fatih_Android_Fixed.zip -d game
          echo "Project files:"
          ls -la game
          test -f game/settings.gradle
          test -f game/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p game assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Fatih-APK
          path: game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
